# LLM-Chess — 一键 Docker 部署: docker compose up -d
# 密钥放 ./config/keys.json (容器内挂载为 /app/config, 持久化), 无需改镜像
# 局域网访问: 在 .env 或环境变量里设 LLMCHESS_HOST=0.0.0.0
services:
  llm-chess:
    build: .
    image: llm-chess:latest
    container_name: llm-chess
    ports:
      - "8788:8788"
    volumes:
      - ./config:/app/config
    healthcheck:
      # busybox wget 内置于 node:22-alpine; 与 Dockerfile HEALTHCHECK 同口径 (/api/health)
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8788/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
