name: 💡 想法 / Ideas
description: 功能建议、协议改进、基准方法论讨论
labels: [idea]
body:
  - type: markdown
    attributes:
      value: |
        感谢提想法！如果是模型棋力/基准方法论相关，请附上可复现的对局数据 (`logs/match_*.json`)。
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives considered
  - type: checkboxes
    id: checklist
    attributes:
      label: 确认 / Confirm
      options:
        - label: 我已搜索过现有讨论 / I searched existing discussions
          required: true
