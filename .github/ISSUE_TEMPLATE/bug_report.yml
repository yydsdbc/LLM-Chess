name: Bug report
description: Report a problem with LLM-chess (engine / LLM agent / UI / server)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! 中文或英文描述都可以。
        ⚠️ Never paste API keys or `config/keys.json` contents — logs only.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npm start
        2. Open http://localhost:8788
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Engine (core/)
        - LLM agent / providers (ai/, server relay)
        - Evaluation / knowledge (evaluation/)
        - UI / Replay / HUD (ui/, replay/, index.html)
        - Server / deployment (server.js, Docker, Start.cmd)
        - Docs / other
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: "e.g. v20.11.0 (node -v)"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Console output or files under logs/ are helpful. Redact any secrets.
    validations:
      required: false
