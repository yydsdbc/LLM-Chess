name: Greetings

# 首次 issue / PR 自动欢迎 (v1.0.daily): 降低社区参与门槛, 首触即给出指引
on: [issues, pull_request_target]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Thanks for opening your first issue! 感谢提交第一个 issue!

            - Please keep the template details filled in (steps to reproduce / console log). 请按模板补全复现步骤与控制台日志。
            - **Never paste your API key.** 永远不要粘贴 API key (日志脱敏后再贴)。
            - Usage questions are better suited to [Discussions](https://github.com/yydsdbc/LLM-Chess/discussions). 使用问题欢迎去 Discussions。

          pr-message: |
            🎉 Thanks for your first PR! 感谢第一个 PR!

            - Before review, make sure `npm test` (7 suites) and `npm run check` (syntax + prompt gate) pass locally. 评审前请本地跑 `npm test` 与 `npm run check` (含提示词硬门禁)。
            - Zero-dependency rule: browser modules must not use `require()`/npm packages. 零依赖规则详见 CONTRIBUTING.md。
            - Never commit `config/keys.json`. 密钥文件严禁入库。
