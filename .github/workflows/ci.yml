name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 最小权限: 只读代码即可跑测试 (v1.0.daily 第4轮安全加固)
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [18, 20, 22]
        # windows-latest 校验主开发平台路径处理 (Start.cmd 用户群), node 22 单点即可
        include:
          - os: windows-latest
            node-version: 22
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      # v1.0.daily: 统一入口 npm run check (全 js 语法扫描 + 提示词硬门禁 dump --check) — 替代 xargs 管道 (Windows runner 不友好), CI 首次设防提示词门禁
      - name: Syntax + prompt gate (npm run check)
        run: npm run check

      - name: Run full test suite (7 suites)
        run: npm test
