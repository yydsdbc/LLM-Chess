name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 最小权限: 只读代码即可跑测试 (v1.0.daily 第4轮安全加固)
permissions:
  contents: read

# 同一分支/PR 的新推送取消仍在跑的旧 run (省 runner 时长, 只看最新结论)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [18, 20, 22, 24]
        # windows-latest 校验主开发平台路径处理 (Start.cmd 用户群), node 22 单点即可
        include:
          - os: windows-latest
            node-version: 22
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      # v1.0.daily: 统一入口 npm run check (全 js 语法扫描 + 提示词硬门禁 dump --check) — 替代 xargs 管道 (Windows runner 不友好), CI 首次设防提示词门禁
      - name: Syntax + prompt gate (npm run check)
        run: npm run check

      - name: Run full test suite
        run: npm test

  # 第83轮: GitHub Pages 部署 — legacy Jekyll 构建连续卡死 (status building 无错误信息),
  # 改 Actions 构建模式: 静态文件原样上传 (本项目零打包步骤), 日志透明可查。
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
