name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
        # windows-latest 校验主开发平台路径处理 (Start.cmd 用户群), node 22 单点即可
        include:
          - os: windows-latest
            node-version: 22
            os-note: windows
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Syntax check all tracked JS files
        run: git ls-files "*.js" | xargs -n 1 node --check

      - name: Run full test suite (7 suites)
        run: npm test
